name: live hardware smoke

on:
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Read-only live hardware smoke test
        env:
          KVMCTL_LIVE_URL: ${{ secrets.KVMCTL_LIVE_URL }}
          KVMCTL_LIVE_TOKEN: ${{ secrets.KVMCTL_LIVE_TOKEN }}
          KVMCTL_LIVE_HOST: ${{ secrets.KVMCTL_LIVE_HOST }}
          KVMCTL_LIVE_INSECURE: "1"
        run: python -m pytest -q tests/test_live_hardware.py
