[project]
name = "kvmctl"
version = "0.1.0"
description = "KVMD-compatible (PiKVM/GLKVM) client core"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24", "Pillow>=10"]

[project.scripts]
kvmctl = "kvmctl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kvmctl"]
